<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oslo guide</title>
<style>
:root{--bg:#faf8f5;--fg:#1f1d1a;--mut:#6d675f;--card:#fff;--line:#e6e1da;--acc:#b5482a;--chip:#f0ebe4}
@media (prefers-color-scheme:dark){:root{--bg:#161514;--fg:#ece8e2;--mut:#a39d94;--card:#1f1e1c;--line:#34312d;--acc:#e8835f;--chip:#2a2826}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:1.25rem;margin:0 0 8px}
input{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:760px;margin:0 auto;padding:8px 16px 48px}
h2{font-size:1rem;margin:22px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 14px}
summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary .new{font-size:.7rem;font-weight:700;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:0 5px}
.body{padding:0 0 14px;white-space:pre-line;color:var(--fg)}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--mut);margin-top:10px}
.meta a{color:var(--acc)}
.count{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.hidden{display:none}
</style></head><body>
<header><h1>Eat by Le Oslo guide</h1>
<input id="q" type="search" placeholder="Search names and notes…" autocomplete="off">
<div class="chips" id="chips"></div><p class="count" id="count"></p></header>
<main id="list"></main>
<script>
const DATA = [{"name": "Hot tips", "places": [{"name": "MAD LOVE", "new": true, "lat": 59.9095476, "lon": 10.767964, "desc": "If you’re craving pizza in Oslo, Mad Love is the spot. They serve big New York–style slices and classic Neapolitan pizzas made with quality ingredients. The vibe is relaxed and friendly—perfect for a casual dinner or sharing one of their huge 52 cm pies with friends."}, {"name": "Vaterland Bar & Scene", "new": true, "lat": 59.913941, "lon": 10.7561606, "desc": "Don’t be intimidated by the heavy metal vibe from the outside. Inside, the staff recommended four different pizzas:\n•Satan\n•Judas\n•Favan\n•Biff & BærNEKRO\n\nMake sure to ask for their signature spicy sauce! Just a warning: the heat kicks in about 20 seconds later. It’s a great spicy sauce that brings flavor without overwhelming it.\n\nMy favorite pizzas were definitely Satan and Judas.\n\nWe paid 849 NOK in total for 4 pizzas."}, {"name": "Tabuno", "new": true, "lat": 59.9067571, "lon": 10.7600687, "desc": "Oslo has a new fine dining spot, and it’s Filipino. Hidden on a side street in Bjørvika, Tabuno offers a set menu starting at 1,200 NOK, with details and service that feel Michelin-level.\n\nHighlights for me:\n•Chicken & coconut broth\n•King crab snacks with a spicy kick\n•Hamachi with rice cake\n•Skewers with egg (the most fun dish of the night)\n•Duck with adobo sauce – crispy skin, juicy meat\n•Pandan ice cream with strawberries to finish\n\nSome dishes leaned a bit heavy or salty, but overall the presentation and experience were impressive.\n\n💡 Pro tip: Let the staff guide your wine choices. Pairings make a big difference here.\n\nPrice ended at about 1,755 NOK per person with champagne and wine.\n\nDefinitely curious to see how the menu evolves."}, {"name": "Cru Wine & French Food", "new": true, "lat": 59.90913, "lon": 10.7547453, "desc": "Cru in Oslo is a cozy yet elegant restaurant blending French bistro flavors with Nordic ingredients, renowned for its refined dishes and one of the city’s best French-focused wine lists."}, {"name": "Varemottaket", "new": true, "lat": 59.9072501, "lon": 10.7589965, "desc": "Varemottaket is a tiny restaurant hidden behind a butcher shop. The menu is grilled over charcoal and changes often, served in a fun and lively setting with music and a casual vibe. It’s fine dining, but without the stiffness."}, {"name": "Sorgenfri", "new": true, "lat": 59.928153, "lon": 10.7196914, "desc": "Sorgenfri is part café, part gallery, and part design shop. It’s a creative space where you can sip a coffee or a glass of wine while browsing art, fashion, and books. The mix of old charm and modern style makes it one of Oslo’s most inspiring hangouts."}, {"name": "Corrals Solli", "new": true, "lat": 59.916496, "lon": 10.71503, "desc": "For tacos with a kick, head to Corral’s. Their specialty is birria tacos—tender, slow-cooked beef served with a rich dipping broth. With locations around the city, it’s an easy pick when you’re in the mood for bold, flavorful street food."}, {"name": "Restaurant Substans", "new": false, "lat": 59.9111622, "lon": 10.7361348, "desc": "Restaurant Substans combines Nordic and Japanese flavors in a stunning glass setting by the waterfront. The menu is seasonal and creative, often served as a multi-course tasting experience. With its beautiful views and refined but relaxed vibe, it’s a great spot for a special night out in Oslo."}, {"name": "Stranden 30", "new": false, "lat": 59.9084791, "lon": 10.7260065, "desc": "This spot has three distinct sections. There's a fine dining area where you can enjoy a full set menu, an outdoor section where you can order drinks and snacks using a QR code, and a more casual bistro offering a 3-course menu. Recommended dishes include the turbot with Szechuan-style seasoning and the steak with fries. This is currently the best restaurant at Aker Brygge"}, {"name": "SEVEN Oslo", "new": false, "lat": 59.9091857, "lon": 10.7546731, "desc": "SEVEN is the newest addition to Oslo’s dining scene, located inside the SIXA building in Barcode. While it sits within an office building, the moment you step inside, you’re transported to a different world. With a central cocktail bar and elegant interiors, SEVEN brings a level of luxury that feels new to this part of the city.\n\nThe space is designed by Kirsti, known for her work on other standout venues like Michaels. Her touch is clear in the warm lighting, thoughtful layout, and inviting atmosphere.\n\nThe kitchen offers a mix of Mediterranean and Asian flavors. On opening night, May 7, the team chose to keep bookings limited to focus on running a smooth first service and it paid off. The starters and snacks stood out, with a balanced mix of maki, sashimi, creamy hummus, and fresh homemade bread.\n\nFor the main courses, the Korean BBQ short ribs were a highlight. The dish brought together sour, spicy, umami, and sweet elements in a way that felt rich and satisfying. The lobster fettuccine was also a strong contender and showed off the kitchen’s versatility.\n\nThe current menu will likely see some adjustments over the coming weeks, but even now, it’s a strong start. For many, SEVEN may become a go-to spot for cocktails and shared plates rather than full meals. The cocktail bar itself is impressive and already stands above many in Oslo, both in execution and presentation.\n\nSEVEN is also well-placed - just a five-minute walk from Oslo Central Station. Whether you’re planning a date, after-work drinks with colleagues, or dinner with friends, the space is flexible and welcoming. Live music and DJs bring extra energy to the evenings without overwhelming the dining experience.\n\nWith friendly staff, a great location, and prices that match most of Oslo’s dining scene, SEVEN has the potential to become a favorite for both locals and visitors."}]}, {"name": "Hidden gems", "places": [{"name": "Kolonihagen Frogner", "new": false, "lat": 59.9188798, "lon": 10.7100224, "desc": ""}, {"name": "Smakeriet", "new": false, "lat": 59.9187321, "lon": 10.7474105, "desc": "Everything is made in-house, and they offer a variety of Brazilian products and food, including coxinha and pão de queijo.\n\nThey have this açaí bowl that’s really good - no added sugar!\n\nIt’s tucked away in Fredensborg and run by a lovely couple — super friendly people!"}, {"name": "Nektar Vinbar", "new": false, "lat": 59.9203689, "lon": 10.7491006, "desc": "Nektar Vinbar is a charming wine bar inside an old red wooden house. They focus on natural wines and serve small, creative dishes to share. It’s relaxed, welcoming, and perfect for an evening with friends."}, {"name": "Chez Colin", "new": false, "lat": 59.9204894, "lon": 10.7492523, "desc": "At Chez Colin, you’ll find a cozy French bistro feel. Seasonal dishes, classic flavors, and a great wine list make it a go-to spot if you’re craving French comfort food in Oslo."}, {"name": "Panu", "new": false, "lat": 59.9179898, "lon": 10.7406975, "desc": "Panu mixes Asian flavors with Nordic ingredients. The food is playful and bold, often served as a tasting menu, and the atmosphere is upbeat with good music, cocktails, and energy."}, {"name": "La Mayor", "new": false, "lat": 59.9164951, "lon": 10.7510104, "desc": "La Mayor brings a modern Mexican twist to Oslo. Expect fresh seafood, bold flavors, and colorful dishes in a stylish and lively space. A great choice for tacos and margaritas with friends."}, {"name": "Le Benjamin bar & bistro", "new": false, "lat": 59.9187145, "lon": 10.7580077, "desc": "Le Benjamin is a French bistro with a laid-back atmosphere. Think hearty dishes, an excellent wine list, and lots of charm. It’s one of those places you’ll want to return to again and again."}, {"name": "Polka Shots & Bites", "new": false, "lat": 59.9178473, "lon": 10.7537746, "desc": "Polka is all about Polish comfort food with a modern touch. Homemade pierogi, soups, and snacks pair perfectly with vodka shots. Warm, casual, and fun—it’s like a little slice of Poland in Oslo."}, {"name": "Liminal", "new": false, "lat": 59.9331757, "lon": 10.7670142, "desc": "With only a handful of tables, Liminal is intimate and creative. The menu changes with the seasons, built around local ingredients and zero-waste ideas. A thoughtful dining experience for when you want something truly special."}, {"name": "Pasta Fresca", "new": false, "lat": 59.9198469, "lon": 10.7600961, "desc": "At Pasta Fresca, the pasta is fresh, simple, and delicious. You can sit down for a quick plate or take some home. It’s a casual neighborhood favorite for when you just need good pasta, fast."}, {"name": "Szechuan Chengdu Restaurant", "new": false, "lat": 59.9231727, "lon": 10.7716652, "desc": "Szechuan Chengdu serves authentic, spicy Chinese food. If you like heat, ask for the red menu—it’s where the real fire is. Bold flavors, plenty of chili, and a true Szechuan experience."}, {"name": "Daegens bakeri", "new": false, "lat": 59.9382955, "lon": 10.7636566, "desc": "Daegens bakeri is a little gem in Torshov. They make some of the city’s best sourdough bread and cardamom buns, along with excellent coffee. It’s the kind of place you’ll want to stop by every weekend."}]}, {"name": "Coffee and pastry ☕️🍰", "places": [{"name": "Speciality Coffee - Java espresso & coffee Business AS", "new": false, "lat": 59.924436, "lon": 10.739647, "desc": "Java is one of those coffee bars where people love to sit outside and people-watch. Did you know that Crown Prince Haakon of Norway met Crown Princess Mette-Marit here?"}, {"name": "Speciality Coffee - Supreme Roastworks AS", "new": false, "lat": 59.9279894, "lon": 10.7592559, "desc": "Supreme Roastworks AS is one of the top coffee bars in Oslo. It's a must-visit if you're serious about coffee. If you want to save money, order the filter coffee — it should give you 2–3 cups"}, {"name": "Speciality Coffee - Tim Wendelboe", "new": false, "lat": 59.9233709, "lon": 10.7556998, "desc": "Tim Wendelboe is a world-renowned coffee roastery and barista. If you're planning to visit, I recommend trying their tasting menu. Otherwise, be sure to arrive early — it can get quite busy after 1 PM"}, {"name": "Speciality Coffee - Kuro Oslo", "new": false, "lat": 59.9207441, "lon": 10.7631274, "desc": "Kuro is a hidden coffee bar in Grünerløkka that's very dog-friendly. They do a great job with most types of coffee and also offer a selection of pastries"}, {"name": "Speciality Coffee - Hakone Coffee", "new": false, "lat": 59.9138937, "lon": 10.7507774, "desc": "If you're in a hurry or just want to sit down without too much fuss, Hakone offers good coffee without needing to be a coffee snob. I love this place because it's Japanese-inspired"}, {"name": "Speciality Coffee - Papegøye", "new": false, "lat": 59.9137032, "lon": 10.7661672, "desc": "Papegøye, formerly known as Neongrut, has some of the best baristas in town. I recommend trying their special menu."}, {"name": "Pastry - Chez Florent", "new": false, "lat": 59.9113597, "lon": 10.781206, "desc": "Just discovered this brand-new pastry shop tucked away inside the same building as Alligator Barbers (yes, the owner runs both!). The place is only two weeks old and not even on Google Maps yet.\n\nThey serve some of the best Pastel de Nata I’ve ever had, and the croissants are excellent too. If you're in the mood for something savory, try their pastrami baguette, starting at 150 NOK. Pastries start from 45 NOK.\n\nGreat food, friendly owner, and a cozy hidden spot — definitely worth checking out!"}, {"name": "Pastry - Farine", "new": false, "lat": 59.9115335, "lon": 10.7815473, "desc": "Farine might be my favorite spot in Kampen — such a cute and Instagrammable place. They now serve coffee from Hibi, which also supplies coffee to Maaemo, a restaurant with three Michelin stars. The pastries are great too. I recommend going early if you get the chance"}, {"name": "Pastry - Hernández Oslo", "new": false, "lat": 59.9314373, "lon": 10.7494079, "desc": "Hernandez is the best place for Basque cheesecake in Oslo. The small coffee bar has a cozy, neighborhood feel. They serve great matcha coffee and have outdoor seating. I recommend going early on weekends"}, {"name": "Pastry - Fåbro gård", "new": false, "lat": 59.9185457, "lon": 10.6310771, "desc": "Set among apple trees and an old farmhouse, Fåbro Gård is a bakery and café with a rustic countryside feel right in Oslo. Their sourdough bread and cardamom buns are legendary, and the garden seating makes it a perfect weekend escape."}, {"name": "Pastry - Pust", "new": false, "lat": 59.9305406, "lon": 10.715018, "desc": "Pust means “breathe” in Norwegian—and that’s exactly the vibe here. Bright, calm, and spacious, it’s a go-to café for students, freelancers, or anyone who needs a peaceful coffee break."}]}, {"name": "Michelin and bib gourmand ⭐️", "places": [{"name": "Bib - Smalhans", "new": false, "lat": 59.9237121, "lon": 10.7397072, "desc": "Smalhans in St. Hanshaugen is a neighborhood favorite with a focus on seasonal, sustainable food. By day, it’s all about soups, burgers, and sweet treats, while evenings bring creative tasting menus with a nose-to-tail approach. Relaxed, friendly, and always delicious."}, {"name": "Bib - The Little Pickle", "new": false, "lat": 59.9190881, "lon": 10.7640397, "desc": "The Little Pickle brings British charm to Oslo. Expect hearty sharing plates, small seasonal dishes, and one of the city’s best Sunday roasts—complete with Yorkshire pudding. It’s relaxed, welcoming, and Michelin has even awarded it a Bib Gourmand for great food at good value."}, {"name": "1 star - Sabi Omakase Oslo", "new": false, "lat": 59.9143357, "lon": 10.7292109, "desc": "At Sabi Omakase, the spotlight is on Edomae-style sushi. With just 10 seats around the counter, this intimate experience is all about precision, pristine ingredients, and an unforgettable omakase journey."}, {"name": "1 star - À L’aise", "new": false, "lat": 59.9291663, "lon": 10.7097209, "desc": "À L’aise blends French elegance with Norwegian produce. With a Michelin star and recognition as Nordic Restaurant of the Year 2023, every dish is carefully crafted and beautifully presented."}, {"name": "1 star - Stallen", "new": false, "lat": 59.9238263, "lon": 10.7263028, "desc": "Once a stable, now a Michelin-starred kitchen, Stallen serves a surprise tasting menu of 15–20 courses. Rooted in local ingredients and even the chef’s own garden, it’s thoughtful, seasonal dining at its finest."}, {"name": "1 star - Restaurant Hot Shop", "new": false, "lat": 59.9281831, "lon": 10.7685813, "desc": "Hot Shop may have a cheeky name, but the food is serious. Once a neighborhood sex shop, it’s now a cozy bistro offering vibrant, ingredient-driven tasting menus in a casual setting."}, {"name": "1 star - Savage", "new": false, "lat": 59.9095391, "lon": 10.7402639, "desc": "Dining at Savage is a journey—literally. Their 18–21 course “Dimensions” menu moves from ocean to forest to city, celebrating Norway’s natural bounty with bold creativity."}, {"name": "1 star - Bar Amour", "new": false, "lat": 59.9281685, "lon": 10.7490486, "desc": "Intimate, moody, and deeply romantic, Bar Amour marries Portuguese culinary traditions with Norwegian ingredients. Its Michelin star is well deserved for both food and atmosphere."}, {"name": "1 star - Hyde", "new": false, "lat": 59.9195926, "lon": 10.748796, "desc": "In Grünerløkka, Hyde offers a lively Michelin-starred experience with modern dishes full of bold flavors. It’s fine dining, but with a fun, energetic edge."}, {"name": "1 star - Mon Oncle", "new": false, "lat": 59.9170511, "lon": 10.738909, "desc": "Mon Oncle is a playful French-inspired bistro with a modern twist. Awarded a Michelin star, it serves refined dishes full of creativity but keeps the atmosphere warm and inviting. Perfect for when you want fine dining with a touch of fun."}, {"name": "3 stars - Maaemo", "new": false, "lat": 59.907545, "lon": 10.7581829, "desc": "Hyde in Grünerløkka is known for bold flavors, natural wines, and a lively vibe that earned it a Michelin star. It’s modern, fun, and full of personality—but catch it soon, as the restaurant is closing down at the end of 2025."}]}, {"name": "Winebar and cocktail bar 🍸", "places": [{"name": "Cocktail - SVANEN Cocktailbar", "new": false, "lat": 59.9124296, "lon": 10.7445708, "desc": "This is one of the best cocktail bars in Oslo. It’s located inside a former pharmacy and has a beautifully preserved interior. Highly recommend trying their signature drinks."}, {"name": "Cocktail - HIMKOK Storgata Destilleri", "new": false, "lat": 59.914292, "lon": 10.7515299, "desc": "Himkok is the most well-known cocktail bar in Oslo. It's hidden behind an unmarked door — only their logo appears outside. They offer a seasonal cocktail menu using local ingredients."}, {"name": "Cocktail - Bettola", "new": false, "lat": 59.9183664, "lon": 10.7596382, "desc": "A cozy and stylish cocktail bar known for its retro vibe and expertly crafted drinks. Located in Grünerløkka."}, {"name": "Cocktail - Albatross", "new": false, "lat": 59.9339266, "lon": 10.7629548, "desc": "A charming bar with a laid-back feel and well-made drinks — a local favorite for a more relaxed evening. More of a neighborhood bar."}, {"name": "Cocktail  - Torggata Botaniske", "new": false, "lat": 59.9161224, "lon": 10.7521276, "desc": "This cocktail bar is perfect for dates, with its lush interior full of real plants. The atmosphere is cozy, and the staff are incredibly friendly."}, {"name": "Winebar - Becco", "new": false, "lat": 59.9171293, "lon": 10.7382023, "desc": ""}, {"name": "Winebar - Café Rouleur Oslo", "new": false, "lat": 59.9238896, "lon": 10.7404799, "desc": "A unique blend of café and bar culture — great for casual drinks, with a welcoming, cycling-inspired theme."}, {"name": "Winebar - Lasarett Vinbar", "new": false, "lat": 59.9331957, "lon": 10.7669217, "desc": ""}, {"name": "Winebar - Oh Dear Aker Brygge", "new": false, "lat": 59.910386, "lon": 10.726572, "desc": "A trendy spot at Aker Brygge with creative cocktails and a lively atmosphere. Great for waterfront views and weekend energy. They also have a very good selection of wines by the glass."}, {"name": "Wine/Cocktail - Byens Tak (rooftop bar)", "new": false, "lat": 59.9145424, "lon": 10.7495766, "desc": "A rooftop gem with panoramic views of Oslo. Perfect for sunset cocktails and city vibes. They offer good prices on wine from the tap. It’s also quite hidden — you wouldn’t know it’s a rooftop bar from the street."}, {"name": "Wine & Food - Frances Vinbar", "new": false, "lat": 59.9150813, "lon": 10.7234562, "desc": ""}, {"name": "Wine & Food - Vinkassen", "new": false, "lat": 59.928404, "lon": 10.7325388, "desc": ""}, {"name": "Wine & Food - Fat City", "new": false, "lat": 59.9252147, "lon": 10.7593968, "desc": ""}, {"name": "Wine & Food - Happy Ending", "new": false, "lat": 59.9193103, "lon": 10.7512067, "desc": ""}, {"name": "Wine & Food - SKAAL Matbar", "new": false, "lat": 59.9234886, "lon": 10.7586254, "desc": ""}, {"name": "Wine & Food - Bukken Vinbar", "new": false, "lat": 59.9228557, "lon": 10.7391274, "desc": ""}, {"name": "Wine & Food - Sparta Vinbar Oslo", "new": false, "lat": 59.9163159, "lon": 10.7500492, "desc": ""}]}, {"name": "Fine Dining and Brasserie 🥩", "places": [{"name": "Brasserie - Vinland Brasserie", "new": false, "lat": 59.9149416, "lon": 10.723653, "desc": "Vinland brings brasserie dining into one of Oslo’s most iconic buildings—the former U.S. Embassy designed by Eero Saarinen. Chef Charif El Messaoudi blends French, American, and Norwegian influences, serving bold dishes like grilled lobster, porterhouse steak, and seasonal seafood over an 800 °C broiler. Paired with one of Norway’s most celebrated wine lists, Vinland is both grand and approachable, perfect for a date night or celebration."}, {"name": "Brasserie - Vintage Kitchen AS", "new": false, "lat": 59.9169624, "lon": 10.7625208, "desc": "Vintage Kitchen feels like a slice of Copenhagen in Oslo. By day, they serve open-faced Danish smørrebrød, and by night the place transforms into a stylish brasserie with small plates and an impressive wine list."}, {"name": "Brasserie - Brasserie France", "new": false, "lat": 59.9130579, "lon": 10.7428031, "desc": "A true classic, Brasserie France has been an Oslo institution for decades. Expect timeless French cooking, white tablecloths, and an atmosphere that feels straight out of Paris."}, {"name": "Brasserie -  Brasserie Blanche", "new": false, "lat": 59.9234299, "lon": 10.7257146, "desc": "Brasserie Blanche blends modern style with French tradition. A bright, elegant space for enjoying bistro classics alongside contemporary touches."}, {"name": "Brasserie - Lutlaget L/L", "new": false, "lat": 59.9058531, "lon": 10.7597135, "desc": "Lutlaget in Bjørvika is part bakery, part brasserie, part wine bar. Cinnamon buns in the morning, pizza or tartare in the evening—it’s a beautifully versatile space that feels casual but carefully crafted."}, {"name": "Fine Dining - Palate", "new": false, "lat": 59.9071137, "lon": 10.7577428, "desc": "Palate is all about modern fine dining with precision and creativity. Seasonal ingredients are at the heart of the menu, making it perfect for special occasions."}, {"name": "Fine Dining - Eero", "new": false, "lat": 59.9151324, "lon": 10.723776, "desc": "At Eero, fine dining is personal and playful. Expect beautifully plated dishes, a relaxed atmosphere, and flavors that balance Nordic inspiration with international flair."}, {"name": "Fine Dining - Theatercaféen", "new": false, "lat": 59.91404, "lon": 10.733891, "desc": "Perhaps Oslo’s most iconic restaurant, Theatercaféen pairs grand interiors with classic fine dining. A timeless venue where history, culture, and cuisine meet."}, {"name": "Bistro - Kafé Republik", "new": false, "lat": 59.9149652, "lon": 10.7542684, "desc": "Kafé Republik is all about everyday charm. A relaxed neighborhood spot with hearty plates, coffee, and a welcoming atmosphere."}, {"name": "Bistro - OSLOSLO", "new": false, "lat": 59.9149282, "lon": 10.7480765, "desc": "Trendy yet unpretentious, OSLOSLO serves approachable food in a buzzy setting. Perfect for casual evenings or a quick bite before heading out."}, {"name": "Bistro - Grotto", "new": false, "lat": 59.922101, "lon": 10.7390157, "desc": "Warm and rustic, Grotto serves comforting bistro fare in a cozy hideaway-style space."}, {"name": "Bistro - Hos Peder", "new": false, "lat": 59.923705, "lon": 10.7594619, "desc": "At Hos Peder, simplicity shines—Scandinavian ingredients meet bistro classics in a setting that feels homely and familiar."}, {"name": "Bistro - Prinsen", "new": false, "lat": 59.9113007, "lon": 10.7434873, "desc": "Prinsen is a long-standing Oslo bistro with a reputation for reliable dishes and a warm, traditional feel. A safe bet for both locals and visitors."}, {"name": "Bistro - Little Wolf", "new": false, "lat": 59.9312289, "lon": 10.7427369, "desc": "Little Wolf is one of the most exciting new places to eat in Oslo right now. The atmosphere is relaxed, the food is full of flavor, and the price is hard to beat.\n\nIn the kitchen is Mitch, who many will remember from Ember. He has done a great job with the set menu, showing real care and creativity in each dish. Also on the team is Rakel, known from Down South Deli, adding another friendly and familiar face.\n\nLittle Wolf is run by Ben and Nud, the team behind popular places like Pao, Breddos, Løkka Deli, and Doug’s Burger. Many say Doug’s might be the best burger in Oslo.\n\nThe full menu costs 650 NOK, with a wine pairing option for 500 NOK. For the quality and experience, the price is very fair.\n\nSome of the highlights included a juicy pork chop grilled over a yakitori grill and fresh pasta. Scallops with ’nduja and the tiramisu dessert are available as add-ons, and both are well worth it. The tiramisu, made by Mitch, is already becoming a signature dish and was a perfect way to end the meal.\n\nLittle Wolf offers great food, a warm setting, and a team that really knows what they are doing. It is a place worth visiting this summer."}, {"name": "Izakaya by Vladimir Pak", "new": false, "lat": 59.9090425, "lon": 10.7423258, "desc": "Many will be surprised to learn that Chef Vladimir is back in Oslo. For those who have followed his work, it’s clear that his cooking has reached a new level. If one word describes his style, it’s balance - carefully thought out dishes that are full of flavor without being overwhelming.\n\nI was fortunate to receive an invitation to the pre-opening of his new restaurant, located in the space that once housed REST by Jimmy Øien. The new concept is simple: Izakaya, but elevated. This is not something we’ve seen at this level in Oslo before.\n\nEvery dish served during the preview was well-executed and thoughtfully presented. From crispy tonkatsu to wagyu on toast, and of course, beautifully made sushi, the menu felt complete and cohesive from start to finish.\n\nThe opening menu will start at 625 NOK, which is very reasonable by Oslo standards - especially considering the quality. The team at Izayaka is already showing strong service and attention to detail. The interior is also carefully designed, with elements like paper sliding doors that give the space a calm and authentic Japanese atmosphere.\n\nLater this year, they plan to open an omakase section on the other side of the restaurant, offering an even more intimate dining experience.\n\nIzayaka is already shaping up to be one of the most exciting new places to eat in Oslo. With a strong concept, talented team, and balanced menu, it’s a place I’m already planning to return to soon."}]}, {"name": "Nightclubs and vibes", "places": [{"name": "Punk Royale Oslo", "new": false, "lat": 59.9159374, "lon": 10.7166861, "desc": "Forget fine dining as you know it—Punk Royale throws out the rulebook. Their Menu Royale is at least 18 courses of pure excess, with caviar bumps, strobe lights, and over-the-top theatrics. It’s decadent, rebellious, and unlike any other meal in Oslo."}, {"name": "BA3", "new": false, "lat": 59.9151651, "lon": 10.7169625, "desc": "BA3 blends Japanese technique with South American flair, serving colorful sashimi, gyoza, and chili-citrus explosions designed for sharing. With multiple floors, bars, and even a rooftop, it’s as much a night out as it is dinner."}, {"name": "Andre Til Høyre", "new": false, "lat": 59.9151115, "lon": 10.7501173, "desc": "Part bar, part living room, Andre Til Høyre feels like Oslo’s chicest apartment. Velvet curtains, cozy sofas, and three themed rooms (lounge, library, and wine bar) set the scene for meticulous cocktails and a seriously good vibe."}, {"name": "Michaels", "new": false, "lat": 59.9225792, "lon": 10.7155461, "desc": "In Briskeby, Michaels combines Mediterranean food, music, and cocktails in a glamorous multi-floor space. From brunch on the terrace to late-night basement parties, it’s a place made for long evenings that turn into memories."}]}, {"name": "Pizza 🍕", "places": [{"name": "Café grensen", "new": false, "lat": 59.9132917, "lon": 10.7431892, "desc": "Surprisingly, they serve very good Neapolitan-style pizza. You can also enjoy both coffee and alcohol here. It's more of a relaxed, laid-back place."}, {"name": "CASBAR", "new": false, "lat": 59.9139119, "lon": 10.732994, "desc": "CASBAR mixes pizza with flair, offering inventive combinations like their “Carbonara-ish” pizza topped with bacon, mushrooms, truffle mayo, and cured egg yolk. They also serve cocktails, making it a lively place to start the night."}, {"name": "Vesuvio pizzeria (Theresesgate)", "new": false, "lat": 59.9281554, "lon": 10.7324958, "desc": "A local favorite serving traditional Italian-style pizzas. Vesuvio (Theresesgate) is simple, reliable, and perfect when you’re craving a no-fuss classic."}, {"name": "ZZ Pizza", "new": false, "lat": 59.9059459, "lon": 10.7750756, "desc": "Housed in a converted car wash in Gamlebyen, ZZ Pizza takes pizza seriously. Their long-fermented dough makes for a light, crunchy base, and their French onion soup pizza is already a cult favorite."}, {"name": "Rosenhoff Kiosk", "new": false, "lat": 59.9286186, "lon": 10.7774679, "desc": "Part of the local fabric, Rosenhoff Kiosk is a friendly stop for grabbing a quick pizza or snack when you’re on the move."}, {"name": "Skovveien Bar & Pizza", "new": false, "lat": 59.9178778, "lon": 10.7184522, "desc": "At Skovveien, you get pizza with a side of bar vibes—great for a slice and a drink in a cozy, laid-back setting."}, {"name": "ZiOPizza Marienlyst", "new": false, "lat": 59.9326134, "lon": 10.7243003, "desc": "ZiOPizza is a go-to for the Marienlyst crowd—straightforward, tasty pizzas made for casual evenings with friends."}, {"name": "Kork", "new": false, "lat": 59.9218797, "lon": 10.7575101, "desc": "A brand-new spot in Grünerløkka, Kork has quickly made waves with bold pizzas like beef & mushroom, or their seasonal chanterelle pie. Prices start at 255 NOK, and the buzz suggests it’s already one of the city’s best pizza newcomers."}, {"name": "Vesuvio - Vista mare", "new": false, "lat": 59.9086326, "lon": 10.7259071, "desc": "Vesuvio – Vista Mare brings together Italian comfort food and beautiful sea views. Pizza with a setting that feels like a slice of the Mediterranean in Oslo."}]}, {"name": "Asian food 🍜", "places": [{"name": "Korean - 175°C K-fried", "new": false, "lat": 59.9225201, "lon": 10.7519057, "desc": "175 Fried Chicken is all about crispy, juicy Korean-style fried chicken. Served with bold sauces and sides, it’s comfort food at its finest—perfect for sharing with friends or devouring solo when the craving hits."}, {"name": "Korean - HANKKI K-MAT", "new": false, "lat": 59.9249772, "lon": 10.742605, "desc": "HANKKI K-MAT brings homemade Korean flavors to Oslo, with classics like bibimbap, tteokbokki, and gimbap. It’s simple, authentic, and full of heart—like stepping into a little piece of Seoul."}, {"name": "Vietnamese - Viet Kitchen", "new": false, "lat": 59.9423427, "lon": 10.7597468, "desc": "At Viet Kitchen, you’ll find hearty bowls and dishes that taste like they came straight from Vietnam. Warm, authentic, and perfect for when you’re craving pho or a fresh noodle salad."}, {"name": "Vietnamese - Far East", "new": false, "lat": 59.9152778, "lon": 10.7533333, "desc": "Far East is one of Oslo’s older Vietnamese restaurants, serving classic dishes in a casual setting. A reliable choice for comforting, traditional flavors."}, {"name": "Chinese - Foodie Asian Restaurant 丽华餐厅", "new": false, "lat": 59.9126893, "lon": 10.736196, "desc": "Foodie Asian Restaurant focuses on authentic Chinese cooking, with a broad menu and plenty of homestyle dishes."}, {"name": "Chinese - Flavour", "new": false, "lat": 59.914179, "lon": 10.7671954, "desc": "Flavour serves crowd-pleasing Chinese staples in a relaxed restaurant setting."}, {"name": "Chinese - Dinner Restaurant", "new": false, "lat": 59.9138209, "lon": 10.7346798, "desc": "Dinner is one of Oslo’s go-to spots for Asian flavors. Located right in the city center, it serves classic Chinese dishes with a modern twist. The elegant setting makes it great for everything from date nights to group dinners, and the food is as beautiful as it is delicious."}, {"name": "Japanese - Jizo Noods", "new": false, "lat": 59.9174753, "lon": 10.7394164, "desc": "Jizo Noods specializes in handmade udon and ramen, with options ranging from spicy miso to vegan kare udon. A walk-in noodle bar perfect for casual dining."}, {"name": "Japanese - Hrimnir Ramen", "new": false, "lat": 59.9213763, "lon": 10.7514386, "desc": "At Hrimnir, you’ll find ramen with Nordic and Japanese influences, served in a hip, creative space."}, {"name": "Japanese - Koie Ramen", "new": false, "lat": 59.917032, "lon": 10.7525344, "desc": "Koie is all about deep flavors and comforting ramen bowls, with a casual, buzzing noodle-bar atmosphere."}, {"name": "Thai - Sukhumvit Soup&Grill", "new": false, "lat": 59.9121807, "lon": 10.7266173, "desc": "Sukhumvit brings Thai soups and grilled specialties together under one roof. Warming, flavorful, and satisfying."}, {"name": "Thai - Kinnara Thai Restaurant", "new": false, "lat": 59.9468771, "lon": 10.7718917, "desc": "A cozy spot for Thai comfort food, Kinnara delivers authentic flavors in generous portions."}, {"name": "Thai - Nam Fah Thai", "new": false, "lat": 59.9228389, "lon": 10.7510516, "desc": "Nam Fah is known for traditional Thai curries and noodle dishes—simple, tasty, and affordable."}, {"name": "Thai - Pao - Thai Bar & Barbecue", "new": false, "lat": 59.9214577, "lon": 10.7575283, "desc": "Pao offers a livelier take, combining Thai barbecue dishes with a bar vibe."}, {"name": "Middle East - Zarathustra Meyhane", "new": false, "lat": 59.9185691, "lon": 10.7596986, "desc": "Zarathustra is a meyhane in Grünerløkka, serving Persian-inspired meze and sharing plates, paired with a thoughtful wine list. Cozy and full of charm."}, {"name": "Middle East - Hummus & Wine", "new": false, "lat": 59.9143988, "lon": 10.7216702, "desc": "As the name suggests, Hummus & Wine brings together creamy dips, fresh Middle Eastern flavors, and good wine in a laid-back space"}, {"name": "Middle East - Feniqia (Oslo)", "new": false, "lat": 59.9061514, "lon": 10.7606192, "desc": "Feniqia serves hearty Lebanese food with plenty of grilled meats, mezze, and warm hospitality."}, {"name": "Greek - Meraki Eat Greek Via Village - Greek Gyros", "new": false, "lat": 59.9121807, "lon": 10.7266173, "desc": "Meraki serves fresh, modern takes on Greek classics—perfect for a Mediterranean fix."}, {"name": "Chinese - Yum Cha", "new": false, "lat": 59.9285521, "lon": 10.7189575, "desc": "For dim sum lovers, Yum Cha is the place—small plates, dumplings, and lots of variety."}, {"name": "Chinese - Beijing Palace", "new": false, "lat": 59.9177288, "lon": 10.738149, "desc": "A long-standing Oslo favorite, Beijing Palace is known for classic Cantonese dishes and friendly service."}, {"name": "Chinese - Dim Sum Oslo & Cocktailbar", "new": false, "lat": 59.9120068, "lon": 10.7356501, "desc": "Dim Sum Oslo pairs its dumplings and small plates with cocktails, giving a fun and lively twist to Chinese dining."}, {"name": "Indian - Der Peppern Gror Rådhusplassen", "new": false, "lat": 59.9124275, "lon": 10.7351495, "desc": "Der Pepper’n Gror is central, reliable, and known for classic Indian dishes with plenty of spice and flavor."}, {"name": "Indian - Jewel of India Restaurant", "new": false, "lat": 59.9159456, "lon": 10.7168612, "desc": "Jewel of India brings traditional Indian dining with an extensive menu of curries, tandoori dishes, and breads."}, {"name": "Indian - LISTEN TO BALJIT Indian Restaurant", "new": false, "lat": 59.9151323, "lon": 10.7175864, "desc": "Playful name, serious food—LISTEN TO BALJIT has become a favorite for bold, creative Indian cooking with a modern twist."}]}, {"name": "Fastfood 🍔", "places": [{"name": "Burger - Dougs Hamburgers", "new": false, "lat": 59.922185, "lon": 10.7520269, "desc": "At Doug’s, it’s all about smash burgers made with premium dry-aged beef. Add fries, a milkshake, or their secret-recipe fried chicken, and you’ve got the full American comfort food experience."}, {"name": "Burger - Dougs Hamburgers", "new": false, "lat": 59.9067348, "lon": 10.7580776, "desc": "At Doug’s, it’s all about smash burgers made with premium dry-aged beef. Add fries, a milkshake, or their secret-recipe fried chicken, and you’ve got the full American comfort food experience."}, {"name": "Burger - Dougs Hamburgers", "new": false, "lat": 59.9091068, "lon": 10.7253277, "desc": "At Doug’s, it’s all about smash burgers made with premium dry-aged beef. Add fries, a milkshake, or their secret-recipe fried chicken, and you’ve got the full American comfort food experience."}, {"name": "Burger - Render Burger", "new": false, "lat": 59.9294748, "lon": 10.7606623, "desc": "Render Burger in Grünerløkka has quickly built a reputation for juicy, freshly ground smash burgers. Simple, no-nonsense, and all about flavor."}, {"name": "Burger - Smash by Ghost Town", "new": false, "lat": 59.9209146, "lon": 10.7591842, "desc": "Creative smash burgers served on Japanese milk bread. With fun names and options for halal and vegan eaters, Smash by Ghost Town puts a playful twist on burger culture."}, {"name": "Burger - Down South Deli", "new": false, "lat": 59.9233515, "lon": 10.7393124, "desc": "Part deli, part diner, Down South Deli serves smash burgers, fried chicken, and stacked sandwiches with an American flair. Walk-in only, it’s all about good food and good vibes."}, {"name": "Fried Chicken - Hot Temper", "new": false, "lat": 59.9211603, "lon": 10.758499, "desc": "If spicy fried chicken is your thing, Hot Temper is the place. Nashville-style chicken sandwiches, fried chicken & waffles, and sides that bring the heat."}, {"name": "Sandwich - Ugly Duckling", "new": false, "lat": 59.9149394, "lon": 10.7368897, "desc": "Oslo’s best sandwiches? Many would say so. Ugly Duckling takes comfort food seriously, with creative combos like duck confit sandwiches that are as indulgent as they are delicious."}, {"name": "Sandwich - Løkka Deli", "new": false, "lat": 59.922151, "lon": 10.7574842, "desc": "In Grünerløkka, Løkka Deli serves American-style sandwiches with big flavors—like Cubanos and Reubens—plus a side of natural wine."}, {"name": "Bagel - Bob the Bagel", "new": false, "lat": 59.9256704, "lon": 10.7762055, "desc": "Bob the Bagel is Oslo’s slice of New York, serving bagels baked fresh every day. A cozy stop for breakfast or brunch."}, {"name": "Bagel - Emmas Bagels", "new": false, "lat": 59.9282786, "lon": 10.7525438, "desc": "Run by Emma herself, this little bagel shop is loved for its tuna and salmon bagels. Small, personal, and highly recommended."}, {"name": "Falafel - Jamal’s Falafel", "new": false, "lat": 59.9185633, "lon": 10.7620123, "desc": "A local favorite for crispy falafel wraps that are quick, cheap, and always tasty."}, {"name": "Falafel - King Falafel", "new": false, "lat": 59.9143595, "lon": 10.7542, "desc": "King Falafel does exactly what the name promises—no fuss, just reliable falafel done right."}, {"name": "Falafel - FALAFEL n' JUICE", "new": false, "lat": 59.925713, "lon": 10.7589993, "desc": "Healthy, fresh, and full of flavor, FALAFEL n’ JUICE is a go-to for a quick, plant-based bite."}, {"name": "Doner - La Cetta Pizzeria", "new": false, "lat": 59.9258616, "lon": 10.7305448, "desc": "While the name suggests pizza, La Cetta is best known for their juicy, flavorful doner wraps. A proper Oslo street-food classic."}, {"name": "Shawarma - Hungry birds Resturant", "new": false, "lat": 59.9166376, "lon": 10.7572312, "desc": "At Hungry Birds, the shawarma is juicy, well-seasoned, and packed with flavor. A casual favorite with loyal fans."}, {"name": "Shawarma - Hungry Birds", "new": false, "lat": 59.912937, "lon": 10.7630866, "desc": "Same name, same spirit—Hungry Birds Restaurant keeps the shawarma flowing in a sit-down style."}, {"name": "Shawarma - Mediterranean Grill", "new": false, "lat": 59.9172643, "lon": 10.7535635, "desc": "Classic, comforting shawarma with all the Mediterranean flavors you’d expect. Warm, hearty, and satisfying."}, {"name": "Shawarma - Sultan Oslo food & sweets‎", "new": false, "lat": 59.9123407, "lon": 10.7653533, "desc": "Sultan is a one-stop shop for Middle Eastern comfort—serving shawarma, kebabs, and hearty plates alongside a tempting display of sweets and desserts. Perfect if you want both savory and sweet in one visit."}]}];
const list = document.getElementById('list'), chips = document.getElementById('chips'),
      q = document.getElementById('q'), count = document.getElementById('count');
let cat = 'All';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
['All', '★ New', ...DATA.map(c => c.name)].forEach(n => {
  const b = document.createElement('button'); b.textContent = n;
  b.onclick = () => { cat = n; render(); }; chips.appendChild(b);
});
function render() {
  const term = q.value.trim().toLowerCase(); let shown = 0, html = '';
  for (const c of DATA) {
    if (cat !== 'All' && cat !== '★ New' && cat !== c.name) continue;
    const items = c.places.filter(p => (cat !== '★ New' || p.new) &&
      (!term || (p.name + ' ' + p.desc).toLowerCase().includes(term)));
    if (!items.length) continue;
    shown += items.length;
    html += `<h2>${esc(c.name)}</h2>` + items.map(p => `<details><summary>${esc(p.name)}${p.new ? '<span class="new">NEW</span>' : ''}</summary>
<div class="body">${esc(p.desc || 'No notes.')}<div class="meta">
<a href="https://www.google.com/maps/search/${encodeURIComponent(p.name)}/@${p.lat},${p.lon},18z">Google Maps</a>
<a href="geo:${p.lat},${p.lon}?q=${p.lat},${p.lon}(${encodeURIComponent(p.name)})">Map app</a>
<span>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span></div></div></details>`).join('');
  }
  list.innerHTML = html || '<p class="count">Nothing matches.</p>';
  count.textContent = `${shown} place${shown === 1 ? '' : 's'}`;
  [...chips.children].forEach(b => b.classList.toggle('on', b.textContent === cat));
}
q.addEventListener('input', render); render();
</script></body></html>
